<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Copa - Meus Palpites</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            background-color: #1f4f0c;
            padding: 0;
            display: flex;
        }

        ul li a {
            display: block;
            color: white;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover {
            background-color: #1f4f0c;
        }

        .jogo-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #f9f9f9;
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .confronto {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 18px;
        }

        .input-gols {
            width: 45px;
            text-align: center;
            padding: 5px;
            font-size: 16px;
            font-family: 'Trebuchet MS', sans-serif;
        }

        .btn-salvar {
            background-color: #1f4f0c;
            color: white;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Trebuchet MS', sans-serif;
        }

        .btn-salvar:hover {
            background-color: #2e7d12;
        }

        .btn-carregar {
            background-color: #1f4f0c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 20px 0;
            font-family: 'Trebuchet MS', sans-serif;
        }

        .bloqueado {
            opacity: 0.5;
            background-color: #ebebeb;
        }
    </style>
</head>

<body style="margin: 0;">
    <header
        style="background-color: #1f4f0c; font-family: 'Trebuchet MS', sans-serif; display: flex; gap: 64px; height: 70px; justify-content: center; align-items: center;">
        <h1 style="color: white;">Bolão da Copa do Mundo 2026</h1>
    </header>
    <style>
        .navbar-custom {
            background-color: #1f4f0c;
            font-family: 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            flex-wrap: wrap;
        }
        .menu-links {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
        }
        .menu-links li a {
            display: block;
            color: white;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 15px;
        }
        .menu-links li a:hover {
            background-color: #2e7d12;
            border-radius: 4px;
        }
        .btn-logout {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Trebuchet MS', sans-serif;
            font-weight: bold;
        }
        .btn-logout:hover {
            background-color: #c9302c;
        }
        @media (max-width: 600px) {
            .navbar-custom { flex-direction: column; padding: 10px; }
            .menu-links { justify-content: center; width: 100%; margin-bottom: 10px; }
            .menu-links li a { padding: 10px 12px; font-size: 14px; }
        }
    </style>

    <nav class="navbar-custom">
        <ul class="menu-links">
            <li><a href="/Inicio/inicio.html">Início</a></li>
            <li><a href="/classificação/classificacao.html">Classificação</a></li>
            <li><a href="/historico.html">Histórico</a></li>
            <li><a href="/participantes.html">Participantes</a></li>
            <li><a href="/palpites.html">Meus Palpites</a></li>
        </ul>
        <button class="btn-logout" id="menu-btn-auth" onclick="gerenciarLogout()">Sair</button>
    </nav>

    <script>
        function gerenciarLogout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => { window.location.href = '/login.html'; });
        }
    </script>

    <div class="container"
        style="font-family:'Trebuchet MS', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px;">
        <h2>Meus Palpites</h2>

        <div style="margin-bottom: 25px;">
            <label for="filtro-tipo"><b>Escolha o Bolão: </b></label>
            <select id="filtro-tipo" style="padding: 8px; font-family: 'Trebuchet MS'; font-size: 15px;" onchange="buscarJogosDaEscolha()">
                <option value="geral">Bolão Geral (Todos os Jogos)</option>
                <option value="brasil">Apenas Jogos do Brasil</option>
            </select>
        </div>

        <div id="loading">Carregando partidas disponíveis...</div>

        <div id="lista-jogos" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

        <button id="btn-carregar-mais" class="btn-carregar" style="display: none;" onclick="exibirMaisDezJogos()">Carregar Mais Jogos</button>
    </div>

    <script>
        let listaJogosFiltrados = [];
        let contadorExibidos = 0;
        let palpitesSalvos = {};
        const PAGINACAO_LIMITE = 10;

        // Puxa do backend os palpites que o usuário já salvou antes para preencher na tela
        function carregarPalpitesSalvos() {
            return fetch('/api/meus_palpites_salvos')
                .then(res => res.json())
                .then(dados => { palpitesSalvos = dados; });
        }

        function buscarJogosDaEscolha() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('lista-jogos').innerHTML = '';
            document.getElementById('btn-carregar-mais').style.display = 'none';

            const tipoEscolha = document.getElementById('filtro-tipo').value;

            // Faz a chamada para a rota correta do Flask passando o parâmetro de tipo
            fetch(`/api/jogos_por_escolha?tipo=${tipoEscolha}`)
                .then(res => res.json())
                .then(jogos => {
                    document.getElementById('loading').style.display = 'none';

                    listaJogosFiltrados = jogos;
                    contadorExibidos = 0;

                    exibirMaisDezJogos();
                });
        }

        function exibirMaisDezJogos() {
            const container = document.getElementById('lista-jogos');
            const proximoLimite = Math.min(contadorExibidos + PAGINACAO_LIMITE, listaJogosFiltrados.length);

            const fatiaDaLista = listaJogosFiltrados.slice(contadorExibidos, proximoLimite);

            fatiaDaLista.forEach(jogo => {
                const card = document.createElement('div');
                // Aplica uma classe de transparência caso o jogo já esteja trancado
                card.className = `jogo-card ${jogo.bloqueado ? 'bloqueado' : ''}`;

                // Verifica se já existe um valor digitado para esse jogo no JSON do usuário
                const apostaExistente = palpitesSalvos[jogo.id_jogo] || { casa: '', fora: '' };

                card.innerHTML = `
                    <div style="font-size: 13px; color: #666;">📅 ${jogo.dia} às ${jogo.hora} ${jogo.bloqueado ? ' | 🔒 Fechado para Apostas' : ''}</div>
                    <div class="confronto">
                        <span style="flex: 1; text-align: right; padding-right: 15px;"><b>${jogo.time_casa}</b></span>
                        <input type="number" class="input-gols" id="casa-${jogo.id_jogo}" min="0" value="${apostaExistente.casa}" ${jogo.bloqueado ? 'disabled' : ''}>
                        <span style="padding: 0 10px;">X</span>
                        <input type="number" class="input-gols" id="fora-${jogo.id_jogo}" min="0" value="${apostaExistente.fora}" ${jogo.bloqueado ? 'disabled' : ''}>
                        <span style="flex: 1; text-align: left; padding-left: 15px;"><b>${jogo.time_fora}</b></span>
                    </div>
                    ${jogo.bloqueado ? '' : `<button class="btn-salvar" onclick="salvarPalpiteIndividual(${jogo.id_jogo})">Salvar Palpite</button>`}
                `;
                container.appendChild(card);
            });

            contadorExibidos = proximoLimite;

            // Gerencia a visibilidade do botão Carregar Mais
            const btnMais = document.getElementById('btn-carregar-mais');
            if (contadorExibidos < listaJogosFiltrados.length) {
                btnMais.style.display = 'block';
            } else {
                btnMais.style.display = 'none';
            }
        }

          function salvarPalpiteIndividual(idDoJogo) {
            const btn = event.target;
            if(btn.disabled) return; // Evita cliques duplos simultâneos

            const golsCasa = document.getElementById(`casa-${idDoJogo}`).value;
            const golsFora = document.getElementById(`fora-${idDoJogo}`).value;

            if (golsCasa === '' || golsFora === '') {
                alert('Por favor, preencha os dois placares antes de enviar!');
                return;
            }

            // Ativa o estado de Loading no botão individual
            btn.disabled = true;
            btn.style.backgroundColor = '#666';
            btn.innerText = '⏳ Salvando...';

            const payload = {};
            payload[idDoJogo] = { casa: parseInt(golsCasa), fora: parseInt(golsFora) };

            fetch('/api/palpites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                // Restaura o botão após o término seguro do processo
                btn.disabled = false;
                btn.style.backgroundColor = '#1f4f0c';
                btn.innerText = 'Salvar Palpite';

                if (data.sucesso) {
                    alert('Palpite computado com sucesso!');
                    palpitesSalvos[idDoJogo] = { casa: golsCasa, fora: golsFora };
                } else {
                    alert('Erro: ' + data.erro);
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.style.backgroundColor = '#1f4f0c';
                btn.innerText = 'Salvar Palpite';
                alert('Erro de rede ao processar palpite.');
            });
        }

        // Execução ao abrir a página
        window.onload = function() {
            carregarPalpitesSalvos().then(() => {
                buscarJogosDaEscolha();
            });
        };
    </script>
</body>

</html>
