<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Copa</title>
    <link rel="stylesheet" href="inicio.css">
</head>

<body>
    <header>
        <h1>Bolão da Copa do Mundo 2026</h1>
    </header>

    <style>
        .navbar-custom {
            background-color: #1f4f0c;
            font-family: 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            flex-wrap: wrap;
        }
        .menu-links {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
        }
        .menu-links li a {
            display: block;
            color: white;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 15px;
        }
        .menu-links li a:hover {
            background-color: #2e7d12;
            border-radius: 4px;
        }
        .btn-logout {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Trebuchet MS', sans-serif;
            font-weight: bold;
        }
        .btn-logout:hover {
            background-color: #c9302c;
        }
        @media (max-width: 600px) {
            .navbar-custom { flex-direction: column; padding: 10px; }
            .menu-links { justify-content: center; width: 100%; margin-bottom: 10px; }
            .menu-links li a { padding: 10px 12px; font-size: 14px; }
        }
    </style>

    <nav class="navbar-custom">
        <ul class="menu-links">
            <li><a href="/Inicio/inicio.html">Início</a></li>
            <li><a href="/classificação/classificacao.html">Classificação</a></li>
            <li><a href="/historico.html">Histórico</a></li>
            <li><a href="/participantes.html">Participantes</a></li>
            <li><a href="/palpites.html">Meus Palpites</a></li>
        </ul>
        <button class="btn-logout" id="menu-btn-auth" onclick="gerenciarLogout()">Sair</button>
    </nav>

    <script>
        function gerenciarLogout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => { window.location.href = '/login.html'; });
        }
    </script>

    <div class="container">
        <h2>Próximos jogos</h2>

        <div id="loading">Carregando jogos...</div>
        <div id="error" style="display: none;"></div>

        <table id="tabela" style="display: none;">
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Hora</th>
                    <th>Time</th>
                    <th>Gols</th>
                    <th></th>
                    <th>Gols</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </div>

    <script>
        function carregarJogos() {
            fetch('jogos.json')
                .then(res => res.json())
                .then(jogos => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('tabela').style.display = 'table';

                    const tbody = document.getElementById('corpo-tabela');
                    tbody.innerHTML = '';

                    jogos.forEach(jogo => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${jogo.dia}</td>
                                <td>${jogo.hora}</td>
                                <td>${jogo.time_casa ?? 'A definir'}</td>
                                <td>${jogo.gols_casa}</td>
                                <td>x</td>
                                <td>${jogo.gols_fora}</td>
                                <td>${jogo.time_fora ?? 'A definir'}</td>
                            </tr>
                        `;
                    });
                })
                .catch(erro => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerHTML = '❌ Erro: execute o Python primeiro para gerar o arquivo jogos.json';
                });
            // Dentro do seu fetch que lê os jogos para montar a tabela inicial:
            fetch('/Inicio/jogos.json')
                .then(res => res.json())
                .then(jogos => {
                    const elementoTabela = document.getElementById('corpo-tabela-jogos');
                    elementoTabela.innerHTML = "";

                    jogos.forEach(jogo => {
                        // REGRA NOVA: Filtra e oculta os confrontos indefinidos ("A definir")
                        if (jogo.time_casa.includes("A definir") || jogo.time_fora.includes("A definir")) {
                            return;
                        }

                        elementoTabela.innerHTML += `
                <tr>
                    <td>${jogo.dia} às ${jogo.hora}</td>
                    <td>${jogo.time_casa} ${jogo.gols_casa} x ${jogo.gols_fora} ${jogo.time_fora}</td>
                </tr>
            `;
                    });
                });
        }

        window.onload = carregarJogos;
    </script>
</body>

</html>
